[package]
name = "tradevault-desktop"
version = "1.0.0"
description = "TradeVault — journal de trading et espace de performance"
authors = ["TradeVault"]
edition = "2021"

# La bibliothèque porte l'application ; `main.rs` ne fait que la lancer
# (structure standard de Tauri 2, prête pour iOS/Android plus tard).
[lib]
name = "tradevault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
