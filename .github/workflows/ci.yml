name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: dummy
      SUPABASE_PUBLISHABLE_KEY: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

      - run: bun test
