name: Desktop

# Les installateurs Windows et macOS de TradeVault (Tauri 2).
# L'application ouvre le site hébergé : rien du code web n'est empaqueté ici,
# seul le shell natif (desktop/src-tauri) est compilé.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: macOS (Apple Silicon + Intel)
            platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Les icônes (ico, icns, png) sont dérivées de l'icône du site : une seule
      # source, jamais de copie qui dérive.
      - name: Icônes
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.1.0 icon ../public/icon-512.png

      - name: Installateurs
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.1.0 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: TradeVault-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
